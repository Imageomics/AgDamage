[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agdamage"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "agdamage"
version = "0.0.1"
authors = [
  { name="Matthew J. Thompson", email="thompson.4509@osu.edu" },
]
description = "FloraPalooza project for detecting herbicide damage to weeds and crops."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = [
    "imageomics",
    "florapalooza",
    "herbicide",
    "damage",
    "weeds",
    "crops",
    "agriculture",
    "images",
    "computer vision",
]
dependencies = [
    "huggingface-hub",
    "datasets",
    "pillow",
    "pandas",
    "numpy",
    "torch",
    "torchvision",
    "open_clip_torch>=3,<4",
    "transformers>=5.15,<6",
    "scikit-learn",
]

[project.optional-dependencies]
analysis = [
    "matplotlib",
    "plotly",
    "umap-learn",
]
notebook = [
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/Imageomics/AgDamage"
Repository = "https://github.com/Imageomics/AgDamage.git"
"Bug Tracker" = "https://github.com/Imageomics/AgDamage/issues"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "I"]
